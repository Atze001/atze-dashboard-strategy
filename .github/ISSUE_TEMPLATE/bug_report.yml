name: Fehler melden
description: Einen reproduzierbaren Fehler in der Atze Dashboard Strategy melden
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Strategy-Version
      placeholder: "z. B. 0.309.0"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home-Assistant-Version
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: "1. …
2. …
3. …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Fehler / Browser-Konsole
      render: text
