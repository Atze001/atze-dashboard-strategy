name: Build dashboard bundle

on:
  push:
    paths:
      - "src/**"
      - "scripts/build.mjs"
      - ".github/workflows/build-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and synchronize version
        run: npm run build

      - name: Commit generated files
        run: |
          if git diff --quiet -- dist/atze-dashboard-strategy.js package.json README.md; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/atze-dashboard-strategy.js package.json README.md
          git commit -m "build: sync generated files"
          git push
