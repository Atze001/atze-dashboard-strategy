name: Build dashboard bundle

on:
  push:
    paths:
      - "src/**"
      - "scripts/build.mjs"
      - ".github/workflows/build-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and synchronize version
        run: npm run build

      - name: Commit generated files
        run: |
          if git diff --quiet -- dist/atze-dashboard-strategy.js package.json README.md; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/atze-dashboard-strategy.js package.json README.md
          git commit -m "build: sync generated files"
          git push

      - name: Create GitHub release after successful build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(grep -m1 'const ATZE_VERSION = ' dist/atze-dashboard-strategy.js | cut -d '"' -f 2)"
          if [ -z "$VERSION" ]; then
            echo "Could not determine ATZE_VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          TARGET="$(git rev-parse HEAD)"
          gh release create "$TAG" \\
            --target "$TARGET" \\
            --title "Atze Dashboard Strategy $TAG" \\
            --generate-notes
