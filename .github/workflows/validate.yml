name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build, syntax, assets and room aliases
        run: npm run validate

      - name: Generated files are up to date
        run: git diff --exit-code -- dist/atze-dashboard-strategy.js package.json README.md

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
